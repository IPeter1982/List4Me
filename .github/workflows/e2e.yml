name: e2e

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: list4me_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend (e2e mode)
        env:
          VITE_API_URL: http://localhost:5058
          VITE_AUTH0_DOMAIN: e2e-tenant.example.com
          VITE_AUTH0_CLIENT_ID: test-client
          VITE_AUTH0_AUDIENCE: list4me-test
          VITE_E2E: "true"
        run: pnpm --filter frontend build

      - name: Start backend (Test env)
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ASPNETCORE_URLS: http://localhost:5058
          AllowedOrigin: http://localhost:4173
          ConnectionStrings__Default: "Host=localhost;Port=5434;Database=list4me_e2e;Username=postgres;Password=postgres"
          Test__SigningKey: "ci-e2e-signing-key-must-be-at-least-32-bytes!"
        run: |
          nohup dotnet run --project backend/src/List4Me.Api --no-launch-profile > backend.log 2>&1 &
          for i in {1..60}; do curl -sf http://localhost:5058/health && break || sleep 1; done

      - name: Start frontend preview
        run: |
          nohup pnpm --filter frontend preview --host 127.0.0.1 --port 4173 > frontend.log 2>&1 &
          for i in {1..30}; do curl -sf http://localhost:4173 && break || sleep 1; done

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Playwright test
        env:
          API_URL: http://localhost:5058
          WEB_URL: http://localhost:4173
        run: pnpm --filter e2e test --project=chromium --workers=1

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
