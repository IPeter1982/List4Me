services:
  postgres:
    image: postgres:17-alpine
    container_name: list4me-postgres
    environment:
      POSTGRES_USER: list4me
      POSTGRES_PASSWORD: list4me_dev
      POSTGRES_DB: list4me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U list4me"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
