services:
  postgres:
    image: postgres:17-alpine
    container_name: list4me-postgres
    environment:
      POSTGRES_USER: list4me
      POSTGRES_PASSWORD: list4me_dev
      POSTGRES_DB: list4me
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U list4me"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["prod-like"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: list4me-backend
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=list4me;Username=list4me;Password=list4me_dev"
      Auth0__Domain: ${AUTH0_DOMAIN:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
      AllowedOrigin: ${ALLOWED_ORIGIN:-http://localhost:5173}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5058:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
